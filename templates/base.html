<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: #eef4ff;
            background:
                radial-gradient(circle at top left, #60a5fa 0%, transparent 35%),
                radial-gradient(circle at bottom right, #2563eb 0%, transparent 40%),
                linear-gradient(135deg, #06172f, #0d2248, #132d5c, #09172f);

            /* Фикс черной полосы при скролле */
            background-attachment: fixed;

            position: relative;

            /* Flexbox для прижатия футера к низу */
            display: flex;
            flex-direction: column;
        }

        /* Background */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -2;
        }

        body::before {
            top: -120px;
            left: -120px;
            background: #3b82f6;
            opacity: .35;
        }

        body::after {
            bottom: -120px;
            right: -120px;
            background: #7c3aed;
            opacity: .25;
        }

        /* Navbar */
        .navbar-custom {
            position: sticky;
            top: 18px;
            width: 95%;
            margin: auto;
            z-index: 1000;

            background: rgba(255, 255, 255, .10);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .35),
                inset 0 1px rgba(255, 255, 255, .25);
        }

        .navbar-container {
            max-width: 1400px;
            margin: auto;
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            text-decoration: none;

            background: linear-gradient(135deg, #ffffff, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            transition: .35s;
        }

        .logo:hover {
            transform: scale(1.08);
        }

        /* Links */
        .nav-links {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            transition: .35s;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
        }

        .nav-links a:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            box-shadow: 0 15px 35px rgba(37, 99, 235, .45);
        }

        /* Username */
        .username {
            padding: 12px 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
            font-weight: 700;
            box-shadow: 0 15px 35px rgba(37, 99, 235, .35);
        }

        /* Logout */
        .logout-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 15px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: .35s;
            box-shadow: 0 12px 30px rgba(239, 68, 68, .35);
        }

        .logout-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 18px 40px rgba(239, 68, 68, .45);
        }

        /* Content */
        .content {
            width: min(1300px, 92%);
            margin: 50px auto;
            padding: 45px;

            /* Заставляет контент занимать всё свободное место, отталкивая футер вниз */
            flex-grow: 1;

            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(24px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow:
                0 35px 80px rgba(0, 0, 0, .35),
                inset 0 1px rgba(255, 255, 255, .18);
            animation: show .8s ease;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Footer Custom */
        .footer-custom {
            width: 95%;
            margin: 0 auto 18px auto;
            padding: 18px 28px;

            background: rgba(255, 255, 255, .10);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .35),
                inset 0 1px rgba(255, 255, 255, .25);

            text-align: center;
        }

        .footer-text {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;

            background: linear-gradient(135deg, #ffffff, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scroll */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 20px;
        }

        /* Responsive */
        @media(max-width: 900px) {
            .navbar-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .nav-links {
                width: 100%;
            }
            .content {
                padding: 28px;
            }
        }

        @media(max-width: 600px) {
            .logo {
                font-size: 28px;
            }
            .nav-links {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }
            .nav-links a,
            .username,
            .logout-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar-custom">
        <div class="navbar-container">
            <a href="{% url 'post_list' %}" class="logo">
                Blog
            </a>
            <div class="nav-links">
                <a href="{% url 'post_list' %}">🏠 Home</a>
                <a href="{% url 'contact' %}">📩 Contact</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'post_create' %}">✍️ New Post</a>
                    <span class="username">
                        {{ user.username }}
                    </span>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button class="logout-btn" type="submit">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Новый крутой Footer -->
    <footer class="footer-custom">
        <div class="footer-text">
            Blog project by Isfandiyor Abdullaev
        </div>
    </footer>

</body>
</html>
