<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog</title>

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification"
          content="EsMkPKqTDEhfdi6zAgJb6pUYEmfHGhmBL8bjbYlJVbU">

    {% load static %}

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">

    <style>

        /* =====================================================
           COLORS
        ===================================================== */

        :root {
            --teal-dark: #004743;
            --teal: #006963;
            --teal-light: #00A9A0;

            --cream: #F0EDE4;
            --cream-soft: #D9D7CF;

            --glass: rgba(0, 71, 67, 0.38);
            --glass-light: rgba(255, 255, 255, 0.045);

            --border: rgba(240, 237, 228, 0.13);

            --shadow: rgba(0, 0, 0, 0.35);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Inter', sans-serif;
        }


        /* =====================================================
           BODY
        ===================================================== */

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;

            color: var(--cream);

            background:
                radial-gradient(
                    circle at 5% 10%,
                    rgba(0, 169, 160, 0.20),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 95% 85%,
                    rgba(0, 169, 160, 0.15),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #003B38 0%,
                    #004743 45%,
                    #003936 100%
                );

            background-attachment: fixed;

            position: relative;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           BACKGROUND DECORATION
        ===================================================== */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -250px;
            left: -250px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 169, 160, 0.25),
                    transparent 65%
                );

            filter: blur(30px);

            pointer-events: none;

            z-index: -2;
        }


        body::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            right: -220px;
            bottom: -220px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 169, 160, 0.18),
                    transparent 65%
                );

            filter: blur(40px);

            pointer-events: none;

            z-index: -2;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar-custom {
            position: sticky;

            top: 18px;

            width: 95%;

            margin: auto;

            z-index: 1000;

            background:
                rgba(0, 60, 57, 0.72);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border:
                1px solid rgba(240, 237, 228, 0.13);

            border-radius: 24px;

            box-shadow:
                0 20px 50px var(--shadow),
                inset 0 1px rgba(255, 255, 255, 0.08);

            transition: 0.3s ease;
        }


        .navbar-custom:hover {
            border-color:
                rgba(0, 169, 160, 0.28);
        }


        .navbar-container {
            max-width: 1400px;

            margin: auto;

            padding: 18px 28px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            font-size: 32px;

            font-weight: 800;

            letter-spacing: 1px;

            text-decoration: none;

            color: #FFFFFF;

            transition: 0.35s ease;
        }


        .logo:hover {
            transform: scale(1.06);
        }


        /* =====================================================
           MOBILE MENU TOGGLE
        ===================================================== */

        .menu-toggle {
            display: none;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(240, 237, 228, 0.15);

            color: var(--cream);

            font-size: 22px;

            padding: 8px 14px;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .menu-toggle:hover {
            background: rgba(0, 169, 160, 0.2);
            color: #FFFFFF;
        }


        /* =====================================================
           NAV LINKS
        ===================================================== */

        .nav-links {
            display: flex;

            gap: 12px;

            align-items: center;

            flex-wrap: wrap;
        }


        .nav-links a {
            color: var(--cream);

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 15px;

            font-weight: 600;

            background:
                rgba(255, 255, 255, 0.035);

            border:
                1px solid rgba(240, 237, 228, 0.08);

            transition: all 0.3s ease;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }


        .nav-links a:hover {
            color: #FFFFFF;

            transform:
                translateY(-4px);

            background:
                linear-gradient(
                    135deg,
                    #006963,
                    #008C84
                );

            border-color:
                rgba(0, 169, 160, 0.35);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.28),
                0 0 25px rgba(0, 169, 160, 0.12);
        }


        /* =====================================================
           USERNAME
        ===================================================== */

        .username {
            padding: 12px 20px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #006963,
                    #008C84
                );

            color: var(--cream);

            font-weight: 700;

            border:
                1px solid rgba(240, 237, 228, 0.12);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        .logout-form {
            display: inline-block;
        }

        .logout-btn {
            border: none;

            padding: 12px 22px;

            border-radius: 15px;

            background:
                rgba(240, 237, 228, 0.08);

            color: var(--cream);

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;

            border:
                1px solid rgba(240, 237, 228, 0.10);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);
        }


        .logout-btn:hover {
            transform:
                translateY(-4px);

            background:
                #8C3B3B;

            color: white;

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.30);
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .content {
            width: min(1300px, 92%);

            margin: 50px auto;

            padding: 45px;

            flex-grow: 1;

            background:
                rgba(0, 55, 52, 0.48);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            border-radius: 30px;

            border:
                1px solid rgba(240, 237, 228, 0.10);

            box-shadow:
                0 35px 80px rgba(0, 0, 0, 0.35),
                inset 0 1px rgba(255, 255, 255, 0.07);

            animation:
                show 0.8s ease;
        }


        @keyframes show {

            from {
                opacity: 0;

                transform:
                    translateY(35px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer-custom {
            width: 95%;

            margin: 0 auto 18px auto;

            padding: 22px 28px;

            background:
                rgba(0, 60, 57, 0.70);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border:
                1px solid rgba(240, 237, 228, 0.12);

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30),
                inset 0 1px rgba(255, 255, 255, 0.07);

            text-align: center;
        }


        .footer-text {
            font-size: 16px;

            font-weight: 600;

            letter-spacing: 0.5px;

            color: var(--cream);
        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        ::-webkit-scrollbar {
            width: 10px;
        }


        ::-webkit-scrollbar-track {
            background:
                #003936;
        }


        ::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    180deg,
                    #00A9A0,
                    #006963
                );

            border-radius: 20px;
        }


        ::-webkit-scrollbar-thumb:hover {
            background:
                #00BDB3;
        }


        /* =====================================================
           RESPONSIVE (MOBILE & TABLET OPTIMIZATIONS)
        ===================================================== */

        @media (max-width: 768px) {

            .navbar-custom {
                top: 10px;
                width: 94%;
                border-radius: 20px;
            }

            .navbar-container {
                padding: 14px 20px;
            }

            .logo {
                font-size: 26px;
            }

            /* Включаем кнопку гамбургера */
            .menu-toggle {
                display: block;
            }

            /* Скрываем ссылки по умолчанию и делаем выпадающее стеклянное меню */
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-top: 15px;
                padding-top: 15px;
                border-top: 1px solid rgba(240, 237, 228, 0.12);
            }

            /* Класс для открытия меню через JS */
            .nav-links.active {
                display: flex;
            }

            .nav-links a,
            .username,
            .logout-btn {
                width: 100%;
                text-align: center;
                padding: 12px;
                font-size: 15px;
            }

            .logout-form {
                width: 100%;
            }

            .content {
                width: 94%;
                padding: 24px 18px;
                margin: 25px auto;
                border-radius: 22px;
            }

            .footer-custom {
                width: 94%;
                padding: 16px;
                border-radius: 18px;
            }

            .footer-text {
                font-size: 14px;
            }
        }


        @media (max-width: 480px) {

            .logo {
                font-size: 24px;
            }

            .content {
                padding: 18px 14px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <nav class="navbar-custom">

        <div class="navbar-container">

            <a
                href="{% url 'post_list' %}"
                class="logo"
            >
                Blog
            </a>

            <!-- Mobile Hamburger Toggle Button -->
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                ☰
            </button>


            <div class="nav-links" id="navLinks">

                <a href="{% url 'post_list' %}">
                    🏠 Home
                </a>


                <a href="{% url 'contact' %}">
                    📩 Contact
                </a>


                {% if user.is_authenticated %}

                    <a href="{% url 'post_create' %}">
                        ✍️ New Post
                    </a>


                    <span class="username">
                        {{ user.username }}
                    </span>


                    <form
                        action="{% url 'logout' %}"
                        method="post"
                        class="logout-form"
                    >

                        {% csrf_token %}

                        <button
                            class="logout-btn"
                            type="submit"
                        >
                            Logout
                        </button>

                    </form>


                {% else %}

                    <a href="{% url 'login' %}">
                        Login
                    </a>


                    <a href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    <!-- =====================================================
         CONTENT
    ===================================================== -->

    <div class="content">

        {% block content %}
        {% endblock content %}

    </div>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="footer-custom">

        <div class="footer-text">
            Blog project by Isfandiyor A.
        </div>

    </footer>


    <!-- =====================================================
         MOBILE MENU SCRIPT
    ===================================================== -->

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                menuToggle.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
            });
        }
    </script>

</body>

</html>
