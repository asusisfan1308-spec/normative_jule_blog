<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef4ff,#dbeafe,#f8fbff);
            min-height:100vh;
            color:#1e293b;
        }

        /* Navbar */

        .navbar-custom{
            position:sticky;
            top:0;
            z-index:1000;
            background:rgba(255,255,255,.75);
            backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(148,163,184,.2);
            box-shadow:0 8px 24px rgba(0,0,0,.05);
        }

        .navbar-container{
            max-width:1200px;
            margin:auto;
            padding:18px 25px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        }

        .logo{
            font-size:28px;
            font-weight:700;
            color:#2563eb;
            text-decoration:none;
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }

        .nav-links a{
            text-decoration:none;
            color:#334155;
            font-weight:600;
            padding:10px 18px;
            border-radius:12px;
            transition:.3s;
        }

        .nav-links a:hover{
            background:#2563eb;
            color:white;
            transform:translateY(-2px);
        }

        .username{
            background:#eff6ff;
            color:#2563eb;
            padding:10px 18px;
            border-radius:12px;
            font-weight:600;
        }

        .logout-btn{
            border:none;
            background:#ef4444;
            color:white;
            padding:10px 18px;
            border-radius:12px;
            cursor:pointer;
            transition:.3s;
            font-weight:600;
        }

        .logout-btn:hover{
            background:#dc2626;
            transform:translateY(-2px);
        }

        /* Main */

        .content{
            max-width:1200px;
            margin:40px auto;
            padding:30px;
            background:rgba(255,255,255,.75);
            backdrop-filter:blur(14px);
            border-radius:22px;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        @media(max-width:768px){

            .navbar-container{
                flex-direction:column;
                align-items:flex-start;
            }

            .nav-links{
                width:100%;
            }

            .content{
                margin:20px;
                padding:20px;
            }

        }
    </style>
</head>

<body>

<nav class="navbar-custom">

    <div class="navbar-container">

        <a href="{% url 'post_list' %}" class="logo">
            Blog
        </a>

        <div class="nav-links">

            <a href="{% url 'post_list' %}">🏠 Home</a>

            <a href="{% url 'contact' %}">📩 Contact</a>

            {% if user.is_authenticated %}

                <a href="{% url 'post_create' %}">✍️ New Post</a>

                <span class="username">
                    👋 {{ user.username }}
                </span>

                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button class="logout-btn" type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
