{% extends 'base.html' %}

{% block content %}

<div class="post-wrapper">

    <div class="post-card">

        <div class="post-header">

            <span class="post-date">
                📅 {{ post.created_at }}
            </span>

            <h1>
                {{ post.title }}
            </h1>

        </div>


        <div class="post-content">
            {{ post.content|linebreaks }}
        </div>


        <div class="divider"></div>


        <div class="post-footer">

            <div class="likes-box">

                <span class="heart">❤️</span>

                <span class="likes-number">
                    {{ post.like_set.count }} Likes
                </span>

            </div>


            {% if user.is_authenticated %}

            <form
                action="{% url 'like_toggle' post.pk %}"
                method="post"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="like-btn"
                >

                    {% if liked %}
                        ❤️ Unlike
                    {% else %}
                        🤍 Like
                    {% endif %}

                </button>

            </form>

            {% endif %}

        </div>

    </div>

</div>


<style>

/* =====================================================
   POST WRAPPER
===================================================== */

.post-wrapper {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 40px 20px 60px;

}


/* =====================================================
   POST CARD
===================================================== */

.post-card {

    width: 100%;

    max-width: 900px;

    background:
        linear-gradient(
            145deg,
            rgba(0, 105, 99, 0.28),
            rgba(0, 55, 52, 0.55)
        );

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    border:
        1px solid rgba(240, 237, 228, 0.13);

    border-radius: 30px;

    padding: 48px;

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.07);

    position: relative;

    overflow: hidden;

    animation:
        showCard 0.7s ease;
}


/* =====================================================
   CARD GLOW
===================================================== */

.post-card::before {

    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    top: -180px;
    right: -120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 169, 160, 0.20),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes showCard {

    from {

        opacity: 0;

        transform:
            translateY(40px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   POST HEADER
===================================================== */

.post-header {

    margin-bottom: 35px;

}


/* =====================================================
   DATE
===================================================== */

.post-date {

    display: inline-flex;

    align-items: center;

    color: #62D8D2;

    font-size: 14px;

    margin-bottom: 20px;

    font-weight: 600;

    padding: 8px 14px;

    border-radius: 10px;

    background:
        rgba(0, 169, 160, 0.08);

    border:
        1px solid rgba(0, 169, 160, 0.12);

}


/* =====================================================
   TITLE
===================================================== */

.post-header h1 {

    font-size: 42px;

    font-weight: 800;

    line-height: 1.25;

    color: #ffffff;

    letter-spacing: -0.8px;

}


/* =====================================================
   POST CONTENT
===================================================== */

.post-content {

    color:
        rgba(240, 237, 228, 0.82);

    font-size: 18px;

    line-height: 2;

    word-break: break-word;

}


/* Paragraphs created by linebreaks */

.post-content p {

    margin-bottom: 18px;

}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    height: 1px;

    margin: 40px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0, 169, 160, 0.35),
            rgba(240, 237, 228, 0.12),
            transparent
        );

}


/* =====================================================
   POST FOOTER
===================================================== */

.post-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    flex-wrap: wrap;

}


/* =====================================================
   LIKES BOX
===================================================== */

.likes-box {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 14px 22px;

    border-radius: 16px;

    background:
        rgba(255, 255, 255, 0.045);

    border:
        1px solid rgba(240, 237, 228, 0.10);

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.15);

    transition: 0.3s ease;

}


.likes-box:hover {

    background:
        rgba(0, 169, 160, 0.08);

    border-color:
        rgba(0, 169, 160, 0.20);

    transform:
        translateY(-2px);

}


/* =====================================================
   HEART
===================================================== */

.heart {

    font-size: 22px;

}


/* =====================================================
   LIKES NUMBER
===================================================== */

.likes-number {

    color: #F0EDE4;

    font-weight: 700;

    font-size: 17px;

}


/* =====================================================
   LIKE BUTTON
===================================================== */

.like-btn {

    border: none;

    cursor: pointer;

    padding: 15px 28px;

    border-radius: 16px;

    color: #F0EDE4;

    font-weight: 700;

    font-size: 16px;

    background:
        linear-gradient(
            135deg,
            #006963,
            #00A9A0
        );

    transition:
        all 0.35s ease;

    border:
        1px solid rgba(240, 237, 228, 0.10);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.25);

}


/* =====================================================
   LIKE BUTTON HOVER
===================================================== */

.like-btn:hover {

    transform:
        translateY(-4px)
        scale(1.03);

    background:
        linear-gradient(
            135deg,
            #008C84,
            #00BDB3
        );

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(0, 169, 160, 0.15);

}


/* =====================================================
   LIKE BUTTON ACTIVE
===================================================== */

.like-btn:active {

    transform:
        translateY(-1px)
        scale(0.98);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    .post-wrapper {

        padding:
            25px 12px 40px;

    }


    .post-card {

        padding: 28px;

        border-radius: 24px;

    }


    .post-header h1 {

        font-size: 30px;

        line-height: 1.3;

    }


    .post-content {

        font-size: 16px;

        line-height: 1.8;

    }


    .post-footer {

        flex-direction: column;

        align-items: stretch;

    }


    .like-btn {

        width: 100%;

    }


    .likes-box {

        justify-content: center;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .post-card {

        padding: 22px;

    }


    .post-header h1 {

        font-size: 26px;

    }


    .post-date {

        font-size: 13px;

    }

}

</style>

{% endblock %}
