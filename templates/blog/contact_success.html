{% extends 'base.html' %}

{% block content %}

<div class="success-wrapper">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h2>Message Sent!</h2>

        <p>
            Thank you for contacting us.<br>
            We received your message and will get back to you as soon as possible.
        </p>

        <a href="{% url 'post_list' %}" class="home-btn">
            🏠 Back to Home
        </a>

    </div>

</div>

<style>

.success-wrapper{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
    padding:40px 20px;

}

.success-card{

    width:100%;
    max-width:650px;

    text-align:center;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:32px;

    padding:60px 45px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.20);

    animation:successAnimation .8s ease;

}

@keyframes successAnimation{

from{

opacity:0;
transform:translateY(40px) scale(.95);

}

to{

opacity:1;
transform:translateY(0) scale(1);

}

}

.success-icon{

    width:110px;
    height:110px;

    margin:0 auto 30px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:55px;

    background:linear-gradient(135deg,#10b981,#34d399);

    color:white;

    box-shadow:
    0 20px 45px rgba(16,185,129,.45);

    animation:pulse 2s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

.success-card h2{

    font-size:42px;

    font-weight:800;

    margin-bottom:18px;

    background:linear-gradient(135deg,#ffffff,#7dd3fc);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.success-card p{

    color:rgba(255,255,255,.72);

    font-size:18px;

    line-height:1.8;

    margin-bottom:40px;

}

.home-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    text-decoration:none;

    padding:16px 36px;

    border-radius:18px;

    font-size:17px;

    font-weight:700;

    color:white;

    background:linear-gradient(135deg,#2563eb,#60a5fa);

    transition:.35s;

    box-shadow:
    0 18px 40px rgba(37,99,235,.35);

}

.home-btn:hover{

    transform:
    translateY(-5px)
    scale(1.04);

    color:white;

    box-shadow:
    0 28px 55px rgba(37,99,235,.45);

}

@media(max-width:768px){

.success-card{

padding:40px 25px;

}

.success-card h2{

font-size:32px;

}

.success-card p{

font-size:16px;

}

.success-icon{

width:90px;
height:90px;
font-size:45px;

}

.home-btn{

width:100%;

}

}

</style>

{% endblock %}
