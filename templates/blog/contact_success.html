{% extends 'base.html' %}

{% block content %}

<div class="success-wrapper">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h2>Message Sent!</h2>

        <p>
            Thank you for contacting us.<br>
            We received your message and will get back to you as soon as possible.
        </p>

        <a href="{% url 'post_list' %}" class="home-btn">
            🏠 Back to Home
        </a>

    </div>

</div>


<style>

/* =====================================================
   SUCCESS WRAPPER
===================================================== */

.success-wrapper {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 75vh;

    padding: 40px 20px;

}


/* =====================================================
   SUCCESS CARD
===================================================== */

.success-card {

    width: 100%;

    max-width: 650px;

    position: relative;

    overflow: hidden;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(0, 105, 99, 0.32),
            rgba(0, 55, 52, 0.62)
        );

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    border:
        1px solid rgba(240, 237, 228, 0.13);

    border-radius: 32px;

    padding: 60px 45px;

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.08);

    animation:
        successAnimation .8s ease;

}


/* =====================================================
   CARD LIGHT
===================================================== */

.success-card::before {

    content: "";

    position: absolute;

    width: 340px;

    height: 340px;

    top: -210px;

    right: -120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 169, 160, 0.22),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes successAnimation {

    from {

        opacity: 0;

        transform:
            translateY(40px)
            scale(.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   SUCCESS ICON
===================================================== */

.success-icon {

    width: 110px;

    height: 110px;

    margin:
        0 auto 30px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 55px;

    background:
        linear-gradient(
            135deg,
            #006963,
            #00A9A0
        );

    color: #F0EDE4;

    border:
        1px solid rgba(240, 237, 228, 0.14);

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.30),
        0 0 30px rgba(0, 169, 160, 0.16);

    animation:
        pulse 2s infinite;

}


/* =====================================================
   ICON PULSE
===================================================== */

@keyframes pulse {

    0% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.08);

    }

    100% {

        transform: scale(1);

    }

}


/* =====================================================
   TITLE
===================================================== */

.success-card h2 {

    font-size: 42px;

    font-weight: 800;

    margin-bottom: 18px;

    color: #FFFFFF;

}


/* =====================================================
   TEXT
===================================================== */

.success-card p {

    color:
        rgba(240, 237, 228, 0.70);

    font-size: 18px;

    line-height: 1.8;

    margin-bottom: 40px;

}


/* =====================================================
   HOME BUTTON
===================================================== */

.home-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    text-decoration: none;

    padding: 16px 36px;

    border-radius: 18px;

    font-size: 17px;

    font-weight: 700;

    color: #F0EDE4;

    background:
        linear-gradient(
            135deg,
            #006963,
            #00A9A0
        );

    border:
        1px solid rgba(240, 237, 228, 0.10);

    transition:
        all .35s ease;

    box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.25);

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.home-btn:hover {

    transform:
        translateY(-5px)
        scale(1.04);

    color: #FFFFFF;

    background:
        linear-gradient(
            135deg,
            #008C84,
            #00BDB3
        );

    box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.30),
        0 0 25px rgba(0, 169, 160, 0.15);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    .success-wrapper {

        min-height: auto;

        padding:
            30px 15px 40px;

    }


    .success-card {

        padding: 40px 25px;

        border-radius: 26px;

    }


    .success-card h2 {

        font-size: 32px;

    }


    .success-card p {

        font-size: 16px;

    }


    .success-icon {

        width: 90px;

        height: 90px;

        font-size: 45px;

    }


    .home-btn {

        width: 100%;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .success-card {

        padding:
            35px 20px;

    }


    .success-card h2 {

        font-size: 28px;

    }

}

</style>

{% endblock %}
