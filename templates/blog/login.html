{% extends 'base.html' %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to your account.</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Login
            </button>
        </form>

    </div>

</div>

<style>

.auth-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
    padding:40px 20px;
}

.auth-card{

    width:100%;
    max-width:560px;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    padding:45px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.20);

    animation:fadeUp .7s ease;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.auth-header{
    text-align:center;
    margin-bottom:35px;
}

.auth-header h2{

    font-size:36px;
    font-weight:800;

    background:linear-gradient(135deg,#ffffff,#7dd3fc);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;

}

.auth-header p{

    color:rgba(255,255,255,.70);

    font-size:15px;

}

.auth-form p{
    margin-bottom:22px;
}

.auth-form label{

    display:block;

    color:#ffffff;

    font-size:15px;

    font-weight:600;

    margin-bottom:8px;

}

.auth-form input{

    width:100%;

    padding:15px 18px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:#fff;

    font-size:15px;

    transition:.35s;

    outline:none;

}

.auth-form input::placeholder{
    color:rgba(255,255,255,.45);
}

.auth-form input:focus{

    border-color:#60a5fa;

    background:rgba(255,255,255,.12);

    box-shadow:
    0 0 25px rgba(96,165,250,.35);

}

.auth-form button{

    width:100%;

    margin-top:18px;

    padding:16px;

    border:none;

    border-radius:16px;

    background:linear-gradient(135deg,#2563eb,#60a5fa);

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

    box-shadow:
    0 15px 35px rgba(37,99,235,.35);

}

.auth-form button:hover{

    transform:
    translateY(-4px)
    scale(1.02);

    box-shadow:
    0 25px 45px rgba(37,99,235,.45);

}

.auth-form .helptext{

    display:block;

    color:rgba(255,255,255,.55);

    margin-top:8px;

    font-size:13px;

}

.auth-form ul{

    list-style:none;

    padding-left:0;

    margin-top:8px;

}

.auth-form li{

    color:#ff8080;

    font-size:13px;

    margin-bottom:5px;

}

.auth-form input[type="checkbox"]{

    width:auto;

    margin-right:8px;

}

@media(max-width:768px){

.auth-card{

padding:30px 22px;

}

.auth-header h2{

font-size:30px;

}

}

</style>

{% endblock %}
