{% extends 'base.html' %}

{% block content %}

<div class="create-wrapper">

    <div class="create-card">

        <div class="create-header">

            <h2>✍️ Create New Post</h2>

            <p>
                Share your ideas with everyone in a beautiful way.
            </p>

        </div>


        <form method="post" class="create-form">

            {% csrf_token %}

            {{ form.as_p }}


            <button type="submit">
                🚀 Publish Post
            </button>

        </form>

    </div>

</div>


<style>

/* =====================================================
   CREATE WRAPPER
===================================================== */

.create-wrapper {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 75vh;

    padding: 40px 20px;

}


/* =====================================================
   CREATE CARD
===================================================== */

.create-card {

    width: 100%;

    max-width: 800px;

    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(0, 105, 99, 0.32),
            rgba(0, 55, 52, 0.58)
        );

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    border:
        1px solid rgba(240, 237, 228, 0.13);

    border-radius: 30px;

    padding: 45px;

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.08);

    animation:
        showCard 0.8s ease;
}


/* =====================================================
   DECORATIVE GLOW
===================================================== */

.create-card::before {

    content: "";

    position: absolute;

    width: 300px;

    height: 300px;

    top: -190px;

    right: -120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 169, 160, 0.22),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes showCard {

    from {

        opacity: 0;

        transform:
            translateY(45px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   HEADER
===================================================== */

.create-header {

    text-align: center;

    margin-bottom: 35px;

}


.create-header h2 {

    font-size: 38px;

    font-weight: 800;

    line-height: 1.2;

    margin-bottom: 12px;

    background:
        linear-gradient(
            135deg,
            #F0EDE4 20%,
            #75DED8 100%
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}


.create-header p {

    color:
        rgba(240, 237, 228, 0.68);

    font-size: 15px;

    line-height: 1.6;

}


/* =====================================================
   FORM
===================================================== */

.create-form p {

    margin-bottom: 22px;

}


/* =====================================================
   LABELS
===================================================== */

.create-form label {

    display: block;

    margin-bottom: 8px;

    color: #F0EDE4;

    font-size: 15px;

    font-weight: 600;

}


/* =====================================================
   INPUTS
===================================================== */

.create-form input,
.create-form textarea,
.create-form select {

    width: 100%;

    padding: 15px 18px;

    background:
        rgba(0, 30, 28, 0.42);

    border:
        1px solid rgba(240, 237, 228, 0.12);

    border-radius: 16px;

    color: #F0EDE4;

    font-size: 15px;

    transition:
        all 0.3s ease;

    outline: none;

    box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.025);
}


/* =====================================================
   TEXTAREA
===================================================== */

.create-form textarea {

    min-height: 180px;

    resize: vertical;

}


/* =====================================================
   PLACEHOLDER
===================================================== */

.create-form input::placeholder,
.create-form textarea::placeholder {

    color:
        rgba(240, 237, 228, 0.40);

}


/* =====================================================
   INPUT FOCUS
===================================================== */

.create-form input:focus,
.create-form textarea:focus,
.create-form select:focus {

    border-color:
        rgba(0, 169, 160, 0.65);

    background:
        rgba(0, 105, 99, 0.18);

    box-shadow:
        0 0 0 3px rgba(0, 169, 160, 0.08),
        0 0 25px rgba(0, 169, 160, 0.14);

    transform:
        translateY(-1px);

}


/* =====================================================
   SELECT OPTIONS
===================================================== */

.create-form select option {

    background: #004743;

    color: #F0EDE4;

}


/* =====================================================
   PUBLISH BUTTON
===================================================== */

.create-form button {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #006963,
            #00A9A0
        );

    color: #F0EDE4;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition:
        all 0.35s ease;

    border:
        1px solid rgba(240, 237, 228, 0.10);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.25);

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.create-form button:hover {

    transform:
        translateY(-5px)
        scale(1.02);

    background:
        linear-gradient(
            135deg,
            #008C84,
            #00BDB3
        );

    box-shadow:
        0 22px 45px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(0, 169, 160, 0.16);

}


/* =====================================================
   BUTTON ACTIVE
===================================================== */

.create-form button:active {

    transform:
        translateY(-1px)
        scale(0.99);

}


/* =====================================================
   HELP TEXT
===================================================== */

.create-form .helptext {

    display: block;

    margin-top: 8px;

    color:
        rgba(240, 237, 228, 0.50);

    font-size: 13px;

    line-height: 1.5;

}


/* =====================================================
   FORM ERRORS
===================================================== */

.create-form ul {

    list-style: none;

    padding-left: 0;

    margin-top: 8px;

}


.create-form li {

    color: #FF9B9B;

    font-size: 13px;

    margin-bottom: 5px;

}


/* =====================================================
   CHECKBOX
===================================================== */

.create-form input[type="checkbox"] {

    width: auto;

    margin-right: 8px;

    accent-color: #00A9A0;

}


/* =====================================================
   FILE INPUT
===================================================== */

.create-form input[type="file"] {

    padding: 12px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    .create-wrapper {

        min-height: auto;

        padding:
            25px 12px 40px;

    }


    .create-card {

        padding: 30px 22px;

        border-radius: 24px;

    }


    .create-header h2 {

        font-size: 30px;

    }


    .create-header p {

        font-size: 14px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .create-card {

        padding: 25px 18px;

    }


    .create-header h2 {

        font-size: 26px;

    }


    .create-form input,
    .create-form textarea,
    .create-form select {

        padding:
            13px 15px;

    }

}

</style>

{% endblock %}
