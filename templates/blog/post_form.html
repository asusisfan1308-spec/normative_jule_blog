{% extends 'base.html' %}

{% block content %}

<div class="create-wrapper">

    <div class="create-card">

        <div class="create-header">
            <h2>✍️ Create New Post</h2>
            <p>Share your ideas with everyone in a beautiful way.</p>
        </div>

        <form method="post" class="create-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                🚀 Publish Post
            </button>
        </form>

    </div>

</div>

<style>

.create-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
    padding:40px 20px;
}

.create-card{

    width:100%;
    max-width:800px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    padding:45px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.20);

    animation:showCard .8s ease;

}

@keyframes showCard{

from{
opacity:0;
transform:translateY(45px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.create-header{

    text-align:center;
    margin-bottom:35px;

}

.create-header h2{

    font-size:38px;
    font-weight:800;

    background:linear-gradient(135deg,#ffffff,#7dd3fc);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:12px;

}

.create-header p{

    color:rgba(255,255,255,.70);
    font-size:15px;

}

.create-form p{

    margin-bottom:22px;

}

.create-form label{

    display:block;

    margin-bottom:8px;

    color:white;

    font-size:15px;

    font-weight:600;

}

.create-form input,
.create-form textarea,
.create-form select{

    width:100%;

    padding:15px 18px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    border-radius:16px;

    color:white;

    font-size:15px;

    transition:.35s;

    outline:none;

}

.create-form textarea{

    min-height:180px;
    resize:vertical;

}

.create-form input::placeholder,
.create-form textarea::placeholder{

    color:rgba(255,255,255,.45);

}

.create-form input:focus,
.create-form textarea:focus,
.create-form select:focus{

    border-color:#60a5fa;

    background:rgba(255,255,255,.12);

    box-shadow:
    0 0 25px rgba(96,165,250,.35);

}

.create-form button{

    width:100%;

    margin-top:20px;

    padding:17px;

    border:none;

    border-radius:18px;

    background:linear-gradient(135deg,#2563eb,#60a5fa);

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

    box-shadow:
    0 15px 35px rgba(37,99,235,.35);

}

.create-form button:hover{

    transform:
    translateY(-5px)
    scale(1.02);

    box-shadow:
    0 25px 45px rgba(37,99,235,.45);

}

.create-form .helptext{

    display:block;

    margin-top:8px;

    color:rgba(255,255,255,.55);

    font-size:13px;

}

.create-form ul{

    list-style:none;

    padding-left:0;

    margin-top:8px;

}

.create-form li{

    color:#ff7d7d;

    font-size:13px;

    margin-bottom:5px;

}

.create-form input[type="checkbox"]{

    width:auto;

    margin-right:8px;

}

@media(max-width:768px){

.create-card{

padding:30px 22px;

}

.create-header h2{

font-size:30px;

}

}

</style>

{% endblock %}
