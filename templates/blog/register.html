{% extends 'base.html' %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-header">

            <h2>Create Account</h2>

            <p>
                Join our community and start sharing your ideas.
            </p>

        </div>


        <form method="post" class="auth-form">

            {% csrf_token %}

            {{ form.as_p }}


            <button type="submit">
                Register
            </button>

        </form>

    </div>

</div>


<style>

/* =====================================================
   AUTH WRAPPER
===================================================== */

.auth-wrapper {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 70vh;

    padding: 40px 20px;

}


/* =====================================================
   AUTH CARD
===================================================== */

.auth-card {

    width: 100%;

    max-width: 560px;

    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(0, 105, 99, 0.32),
            rgba(0, 55, 52, 0.62)
        );

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    border:
        1px solid rgba(240, 237, 228, 0.13);

    border-radius: 30px;

    padding: 45px;

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.08);

    animation:
        show .7s ease;

}


/* =====================================================
   CARD DECORATION
===================================================== */

.auth-card::before {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    top: -180px;

    right: -100px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 169, 160, 0.22),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes show {

    from {

        opacity: 0;

        transform:
            translateY(40px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   HEADER
===================================================== */

.auth-header {

    text-align: center;

    margin-bottom: 35px;

}


.auth-header h2 {

    font-size: 36px;

    font-weight: 800;

    margin-bottom: 10px;

    color: #FFFFFF;

}


.auth-header p {

    color:
        rgba(240, 237, 228, 0.68);

    font-size: 15px;

    line-height: 1.6;

}


/* =====================================================
   FORM
===================================================== */

.auth-form p {

    margin-bottom: 22px;

}


/* =====================================================
   LABEL
===================================================== */

.auth-form label {

    display: block;

    margin-bottom: 8px;

    color: #F0EDE4;

    font-weight: 600;

    font-size: 15px;

}


/* =====================================================
   INPUT
===================================================== */

.auth-form input {

    width: 100%;

    padding: 15px 18px;

    border-radius: 15px;

    border:
        1px solid rgba(240, 237, 228, 0.13);

    background:
        rgba(0, 30, 28, 0.42);

    color: #F0EDE4;

    font-size: 15px;

    transition:
        all .35s ease;

    outline: none;

}


.auth-form input::placeholder {

    color:
        rgba(240, 237, 228, 0.40);

}


/* =====================================================
   INPUT FOCUS
===================================================== */

.auth-form input:focus {

    border-color:
        rgba(0, 169, 160, 0.65);

    background:
        rgba(0, 105, 99, 0.18);

    box-shadow:
        0 0 0 3px rgba(0, 169, 160, 0.08),
        0 0 25px rgba(0, 169, 160, 0.14);

}


/* =====================================================
   REGISTER BUTTON
===================================================== */

.auth-form button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 16px;

    cursor: pointer;

    font-size: 16px;

    font-weight: 700;

    color: #F0EDE4;

    background:
        linear-gradient(
            135deg,
            #006963,
            #00A9A0
        );

    transition:
        all .35s ease;

    margin-top: 15px;

    border:
        1px solid rgba(240, 237, 228, 0.10);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.25);

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.auth-form button:hover {

    transform:
        translateY(-4px)
        scale(1.02);

    background:
        linear-gradient(
            135deg,
            #008C84,
            #00BDB3
        );

    box-shadow:
        0 22px 45px rgba(0, 0, 0, 0.30),
        0 0 25px rgba(0, 169, 160, 0.15);

}


/* =====================================================
   HELP TEXT
===================================================== */

.auth-form .helptext {

    display: block;

    margin-top: 8px;

    color:
        rgba(240, 237, 228, 0.50);

    font-size: 13px;

    line-height: 1.5;

}


/* =====================================================
   ERRORS
===================================================== */

.auth-form ul {

    list-style: none;

    padding-left: 0;

    margin-top: 8px;

}


.auth-form li {

    color: #FF9B9B;

    font-size: 13px;

    margin-bottom: 5px;

}


/* =====================================================
   CHECKBOX
===================================================== */

.auth-form input[type="checkbox"] {

    width: auto;

    margin-right: 8px;

    accent-color: #00A9A0;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 768px) {

    .auth-wrapper {

        min-height: auto;

        padding:
            30px 15px 40px;

    }


    .auth-card {

        padding: 30px 22px;

        border-radius: 24px;

    }


    .auth-header h2 {

        font-size: 30px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .auth-card {

        padding: 25px 18px;

    }


    .auth-header h2 {

        font-size: 27px;

    }


    .auth-form input {

        padding:
            13px 15px;

    }

}

</style>

{% endblock %}
